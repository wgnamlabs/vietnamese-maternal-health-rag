# Deterministic Q2/Q3/Q4 patterns. Q2 is checked before Q3, then Q4.
personalized:
  patterns:
    - id: personal_result_interpretation
      regex: "(?:kết quả|chỉ số|xét nghiệm|siêu âm|huyết áp|đường huyết|protein niệu) của (?:tôi|em|mình|vợ tôi|chồng tôi|bé nhà tôi).{0,120}(?:có sao không|nghĩa là gì|bình thường không|nguy hiểm không|kết luận)"
    - id: diagnosed_by_doctor_interpretation
      regex: "(?:bác sĩ|bệnh viện).{0,80}(?:chẩn đoán|bảo|nói) (?:tôi|em|mình|vợ tôi|bé).{0,120}(?:là gì|nghĩa là gì|có sao không|có nguy hiểm không)"
    - id: personal_number_interpretation
      regex: '(?:tôi|em|mình|vợ tôi|bé nhà tôi).{0,80}(?:đo được|kết quả là|chỉ số là|đang ở mức)\s*\d[^?]{0,100}(?:có sao không|nguy hiểm không|bình thường không|phải làm sao)'
prescription:
  patterns:
    - id: medication_choice
      regex: '(?:tôi|em|mình)\s+(?:nên|có nên)\s+(?:uống|dùng|ngừng|đổi|tăng|giảm)\s+(?:thuốc|liều|kháng sinh|insulin|vitamin|canxi|sắt)'
    - id: dose_or_regimen_change
      regex: '(?:tăng|giảm|đổi|ngừng|bỏ|tiếp tục)\s+(?:liều|thuốc|phác đồ|đơn thuốc)|(?:uống|dùng)\s+(?:bao nhiêu|mấy viên|liều nào)'
    - id: personal_treatment_instruction
      regex: '(?:tôi|em|mình)\s+(?:phải|cần)\s+(?:uống|dùng|tiêm|điều trị)\s+(?:thuốc|liều|insulin|kháng sinh)'
admin:
  patterns:
    - id: hospital_paperwork
      regex: "(?:giấy tờ|thủ tục|hồ sơ|quầy|đăng ký).{0,80}(?:nhập viện|sinh|khám|bệnh viện|phòng khám)"
    - id: hospital_cost
      regex: "(?:chi phí|giá tiền|viện phí|bảo hiểm).{0,80}(?:sinh|khám|nhập viện|bệnh viện|siêu âm|xét nghiệm)"
    - id: hospital_schedule
      regex: '(?:lịch|giờ|mấy giờ|ngày chủ nhật).{0,80}(?:khám|làm việc|tiếp nhận|bệnh viện|phòng khám)'
    - id: hospital_admission_process
      regex: "(?:quy trình|thủ tục).{0,80}(?:nhập viện|tiếp nhận|đăng ký khám)"
