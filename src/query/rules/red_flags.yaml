# Deterministic Q1 rules. Primary phrases are grounded in data/cleaned/.
# Variants are colloquial forms and are intentionally narrower than the source phrase.
patterns:
  - id: obstetric_postpartum_hemorrhage_500ml
    regex: "chảy máu(?: âm đạo)? (?:quá|trên) 500 ?ml|chảy máu (?:trên|hơn) 500 ?ml.*(?:vẫn )?tiếp tục"
    variants: ["chảy máu nhiều sau sinh", "băng huyết sau sinh", "máu ra rất nhiều sau đẻ"]
    source: "qd_4128_2016_dich_vu_cssk_sinh_san_clean.md:678 — Chảy máu âm đạo quá 500 ml sau đẻ được gọi là chảy máu sau đẻ."
  - id: obstetric_postpartum_hemorrhage_qualitative
    regex: "(?:vừa sinh|sau sinh|sau đẻ).{0,60}(?:máu ra rất nhiều|máu vẫn không ngừng|chảy máu nhiều)|(?:máu ra rất nhiều|máu vẫn không ngừng|chảy máu nhiều).{0,60}(?:vừa sinh|sau sinh|sau đẻ)"
    variants: ["máu ra rất nhiều sau sinh", "máu vẫn không ngừng sau đẻ", "chảy máu nhiều sau sinh"]
    source: "qd_4128_2016_dich_vu_cssk_sinh_san_clean.md:676-693 — Chảy máu sau đẻ là biến chứng thường gặp nhất; chảy máu ngay sau khi sổ rau là triệu chứng phổ biến nhất."
  - id: obstetric_sudden_heavy_bleeding
    regex: "chảy máu đột ngột|máu ra đỏ tươi.*máu cục.*lượng máu.*nhiều hơn"
    variants: ["đang mang thai bị chảy máu nhiều", "ra máu đỏ tươi kèm cục máu"]
    source: "qd_4128_2016_dich_vu_cssk_sinh_san_clean.md:617 — Chảy máu đột ngột, không kèm đau bụng, máu ra đỏ tươi lẫn máu cục... lượng máu ra càng về sau càng nhiều hơn."
  - id: obstetric_vaginal_bleeding_red
    regex: "ra máu âm đạo đỏ tươi"
    variants: ["chảy máu âm đạo đỏ tươi", "máu đỏ tươi khi mang thai"]
    source: "qd_4128_2016_dich_vu_cssk_sinh_san_clean.md:531 — Ra máu âm đạo đỏ tươi."
  - id: obstetric_seizure
    regex: 'cơn co cứng.{0,30}co giật|co giật (?:khu trú|toàn thân)|(?<!tiền )sản giật'
    variants: ["bị co giật khi mang thai", "thai phụ lên cơn giật", "sùi bọt mép và co giật"]
    source: "qd_1154_2024_tang_huyet_ap_tien_san_giat_clean.md:109 — Xuất hiện những cơn co cứng - co giật khu trú hoặc toàn thân..."
  - id: severe_preeclampsia_neuro_visual
    regex: "đau đầu không đáp ứng với thuốc giảm đau.{0,100}(?:nhìn mờ|lóa sáng|ám điểm)|(?:nhìn mờ|lóa sáng|ám điểm).{0,100}(?:đau đầu|huyết áp)"
    variants: ["đau đầu dữ dội nhìn mờ khi mang thai", "hoa mắt kèm đau đầu và huyết áp cao"]
    source: "qd_1154_2024_tang_huyet_ap_tien_san_giat_clean.md:62 — Xuất hiện triệu chứng thần kinh, thị giác (đau đầu không đáp ứng với thuốc giảm đau..., nhìn mờ, lóa sáng, ám điểm)."
  - id: obstetric_acute_dyspnea_cyanosis
    regex: "đột ngột khó thở.{0,100}(?:môi|đầu chi).{0,30}tím|khó thở.{0,60}tím tái|khó thở.*ngừng thở"
    variants: ["khó thở dữ dội khi mang thai", "môi tím và khó thở"]
    source: "qd_1154_2024_tang_huyet_ap_tien_san_giat_clean.md:61 — Phù phổi cấp: đột ngột khó thở, nhịp thở nhanh... môi và đầu chi tím..."
  - id: obstetric_premature_rupture
    regex: "vỡ ối non|vỡ ối sớm|rỉ ối"
    variants: ["nước ối chảy ra sớm", "bị chảy nước ối trước ngày sinh"]
    source: "qd_4128_2016_dich_vu_cssk_sinh_san_clean.md:496 — ... rỉ ối, vỡ ối non..."
  - id: reduced_fetal_movement
    regex: "không thấy thai máy|giảm (?:cử động|thai máy)|bất thường.{0,20}(?:cử động thai|thai máy)"
    variants: ["thai không cử động như bình thường", "thai ít cử động hơn", "em bé không đạp như mọi ngày", "em bé trong bụng ít đạp hơn", "thai không đạp như mọi ngày"]
    source: "qd_4128_2016_dich_vu_cssk_sinh_san_clean.md:580 — ... không thấy thai máy, không thấy hoạt động tim thai."
  - id: neonatal_convulsion
    regex: "trẻ sơ sinh.{0,40}co giật|sơ sinh.{0,40}co giật|co giật.{0,40}(?:bé|trẻ sơ sinh)"
    variants: ["em bé mới sinh bị giật", "bé sơ sinh lên cơn co giật"]
    source: "qd_2323_2025_cham_soc_dieu_tri_so_sinh_clean.md:75 — Co giật."
  - id: neonatal_respiratory_distress
    regex: 'thở rút lõm lồng ngực|khó thở.{0,40}(?:trẻ|bé|sơ sinh)|ngừng thở.{0,40}(?:trẻ|bé|sơ sinh)|tần số thở\\s*60\\s*lần'
    variants: ["bé sơ sinh thở bất thường", "bé mới sinh thở khó", "bé không thở được"]
    source: "qd_2323_2025_cham_soc_dieu_tri_so_sinh_clean.md:77-79 — Thở rút lõm lồng ngực; Tần số thở 60 lần phút."
  - id: neonatal_cyanosis_flaccidity
    regex: "(?:trẻ|bé|sơ sinh).{0,50}(?:tím tái|cơ mềm nhẽo|người mềm nhũn)|tím tái.{0,50}(?:ngừng thở|trẻ|bé)"
    variants: ["bé mới sinh bị tím", "bé tím tái và mềm nhũn"]
    source: "qd_4128_2016_dich_vu_cssk_sinh_san_clean.md:319 — Khó thở, ngừng thở, tím tái, cơ mềm nhẽo."
  - id: neonatal_temperature_or_feeding
    regex: '(?:trẻ|bé|sơ sinh).{0,50}(?:sốt\\s*38|sốt cao|hạ thân nhiệt|bỏ bú|bú kém)'
    variants: ["bé sơ sinh sốt cao", "bé mới sinh bỏ bú", "em bé bị lạnh bất thường"]
    source: "qd_2323_2025_cham_soc_dieu_tri_so_sinh_clean.md:79 — Sốt 38°C hoặc hạ thân nhiệt <36,5°C; qd_4128_2016_dich_vu_cssk_sinh_san_clean.md:399 — Bú kém, bỏ bú."
  - id: maternal_danger_signs_combined
    regex: "(?:sốt cao|mạch nhanh|da rất xanh|phù nề).{0,80}(?:co giật|tăng ha|tăng huyết áp)|(?:tăng huyết áp|huyết áp cao).{0,80}(?:đau đầu|nhìn mờ|co giật)"
    variants: ["huyết áp cao kèm đau đầu", "sốt cao và co giật sau sinh"]
    source: "qd_4128_2016_dich_vu_cssk_sinh_san_clean.md:401 — Các dấu hiệu nguy hiểm: Sốt cao; Mạch nhanh; Tăng HA; Da rất xanh; Phù nề; Co giật..."
